app:
  name: "Selenium Automation Framework"
  baseUrl: "https://example.com"

environments:
  dev:
    baseUrl: "https://example.com"
  test:
    baseUrl: "https://example.com"
  staging:
    baseUrl: "https://example.com"
  prod:
    baseUrl: "https://example.com"

testing:
  environment: "test"
  parallel:
    enabled: false
    threadCount: 1

browser:
  default: "chrome"
  headless: false
  maximize: true

  chrome:
    options:
      - "--no-sandbox"
      - "--disable-dev-shm-usage"
      - "--disable-gpu"

  firefox:
    preferences:
      "dom.webnotifications.enabled": false

  edge:
    options:
      - "--no-sandbox"
      - "--disable-dev-shm-usage"

timeouts:
  implicit: 10
  explicit: 20
  pageLoad: 60
  script: 30
  polling: 500

screenshots:
  enabled: true
  onFailure: true
  directory: "test-output/screenshots"

reports:
  directory: "test-output/reports"

logging:
  directory: "test-output/logs"

features:
  screenshots: true
  crossBrowserTesting: true

users:
  test:
    username: "test_user"
    password: "Test@123"
  admin:
    username: "admin_user"
    password: "Admin@123"

testData:
  path: "src/test/resources/testdata/"
  files:
    userCredentials: "users.xlsx"
